server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los agentes suben PDFs y fotos en base64. El default de nginx es 1MB y
    # devuelve 413 sin explicación.
    client_max_body_size 40m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Una generación larga (calendario de contenido, deck) tarda minutos.
        # Sin esto nginx corta a los 60s por default y el navegador ve un 504.
        proxy_connect_timeout 75s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;

        # Sin buffering la respuesta llega apenas el backend la termina.
        proxy_buffering off;
    }
}
