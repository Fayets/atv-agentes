server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Los agentes suben PDFs y fotos en base64. El default de nginx es 1MB y
    # devuelve 413 sin explicación.
    client_max_body_size 40m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolución en cada request, no al arrancar.
        # Con `proxy_pass http://api:5001/...` nginx resuelve el hostname al
        # iniciar: si el contenedor api todavía no existe, nginx muere con
        # "host not found in upstream" y se cae TODO el sitio, incluido el
        # login, que ni siquiera usa el backend. Con la variable + resolver
        # (127.0.0.11 es el DNS interno de Docker) el frontend sigue en pie y
        # solo fallan las llamadas a /api.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:5001;
        proxy_pass http://$api_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Una generación larga tarda minutos. Sin esto nginx corta a los 60s
        # por default y el navegador ve un 504.
        proxy_connect_timeout 75s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering off;
    }
}
