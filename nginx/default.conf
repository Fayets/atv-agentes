server {
    listen 80;
    server_name agentes.atvos.io;

    # Debe ser >= al del nginx del frontend, si no corta esta capa primero.
    client_max_body_size 40m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Resolución por request, no al arrancar.
        # Con `proxy_pass http://frontend:80` nginx resuelve el hostname una
        # sola vez al iniciar y cachea esa IP para siempre. Cada vez que se
        # recrea el contenedor frontend, Docker le da una IP nueva y este
        # nginx sigue pegándole a la vieja: 502 en todo el sitio hasta que
        # alguien lo reinicia a mano. Con la variable + resolver (127.0.0.11
        # es el DNS interno de Docker) el deploy deja de necesitar ese paso.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $front_upstream frontend:80;
        proxy_pass http://$front_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 75s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering off;
    }
}
