version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atv-agentes-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5001"
    networks:
      - atv-agentes-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atv-agentes-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - atv-agentes-net

  nginx:
    image: nginx:alpine
    container_name: atv-agentes-nginx
    restart: unless-stopped
    ports:
      - "8010:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    networks:
      - atv-agentes-net

networks:
  atv-agentes-net:
    driver: bridge
